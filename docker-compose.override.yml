services:
  nginx:
    ports:
      - "${TS_INTERFACE:-127.0.0.1}:8082:80"
    networks:
      - default
      - tasks_shared
  redis:
    ports:
      - "${TS_INTERFACE:-127.0.0.1}:6379:6379"
  db:
    ports:
      - "${TS_INTERFACE:-127.0.0.1}:5435:5432"
  superset:
    build:
      context: .
      dockerfile: Dockerfile.ssh
      target: dev
      args:
        INCLUDE_CHROMIUM: "true" 
    ports:
      - "${TS_INTERFACE:-127.0.0.1}:8089:8088"
      - "${TS_INTERFACE:-127.0.0.1}:8081:8081"
    volumes:
      - /home/superset/repos/Ntherm-DW/:/app/Ntherm-DW
      - /opt/superset-ssh:/mnt/ssh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tasks_app_network
      - default
  superset-worker:
      build:
        context: .
        dockerfile: Dockerfile.ssh
        target: dev
        args:
          INCLUDE_CHROMIUM: "true"
      mem_limit: 2038m
      mem_reservation: 128M
      volumes:
        - /home/superset/repos/Ntherm-DW/:/app/Ntherm-DW
        - /opt/superset-ssh:/mnt/ssh:ro
      networks:
        - tasks_app_network
        - default

networks:
  tasks_shared:
    external: true
  tasks_app_network:
    external: true
  default:

